# Kişisel Takip Paneli — geliştirme ortamı
# Kaynak kodu bind-mount edilir; kod değişiklikleri hot-reload ile yansır.
# Başlat: docker compose up --build -d  /  Durdur: docker compose down

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Hosttan (Compass vb.) erişmek istersen aç; brew ile kurulu bir Mongo
    # 27017'yi kullanıyorsa çakışmayı önlemek için kapalı tutuldu.
    # ports:
    #   - "27017:27017"

  api:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/kisisel-proje
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./server/uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  panel:
    build: ./client
    restart: unless-stopped
    environment:
      # Konteyner içinde API'ye hizmet adı üzerinden ulaşılır
      API_PROXY_TARGET: http://api:4000
      # VirtioFS dosya olaylarını kaçırdığı için HMR için polling modu
      USE_POLLING: '1'
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
